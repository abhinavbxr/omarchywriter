[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchywriter"
version = "1.1.0"
description = "A focused Markdown editor that follows Omarchy themes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.5",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
omarchywriter = "omarchywriter.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["omarchywriter*"]
